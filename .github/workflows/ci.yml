name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            requirements: requirements-ir-minimum.txt
          - python: '3.14'
            requirements: requirements-ir-current.txt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: ruff check custom_components/broadlink_ir_mapper tests/ir_mapper scripts
      - run: ruff format --check custom_components/broadlink_ir_mapper tests/ir_mapper scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --check custom_components/broadlink_ir_mapper/frontend/ir-mapper.js
      - run: npm run check:build
      - run: npm test
      - run: pytest
      - run: python scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: ir-mapper-python-${{ matrix.python }}
          path: broadlink_ir_mapper.zip
